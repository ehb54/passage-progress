<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>screenshot frame</title>
<!-- Headless --screenshot ignores a top-level page's scroll position, so the demo
     is shown inside a full-window frame: frame.html?shot=2 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script>
  const f = document.createElement('iframe');
  f.src = 'demo.html' + location.search;
  document.body.appendChild(f);
</script>
</body>
</html>
